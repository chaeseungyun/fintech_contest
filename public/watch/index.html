<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinStay AI 시연 영상</title>
  <meta property="og:title" content="FinStay AI 시연 영상" />
  <meta property="og:description" content="보유 금융상품 사이의 연결과 손익 변화를 미리 보는 체험본 시연 (2분)" />
  <meta property="og:image" content="/demo-poster.jpg" />
  <style>
    /* 화면을 영상으로 채운다. 칸의 크기는 처음부터 16:9 로 잡아 둔다 — 브라우저 기본 플레이어처럼 작게 떴다가 커지지 않게.
       남는 여백은 영상 바탕색과 같은 색이라 경계가 보이지 않는다 */
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; background: #fefefe; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .frame {
      width: min(100vw, 100vh * 16 / 9);
      width: min(100vw, 100dvh * 16 / 9);
      aspect-ratio: 16 / 9;
      background: #fefefe url('/demo-poster.jpg') center / cover no-repeat;
    }
    video { display: block; width: 100%; height: 100%; background: transparent; }
  </style>
</head>
<body>
  <div class="frame">
    <video src="/demo.mp4" poster="/demo-poster.jpg" controls playsinline preload="metadata"></video>
  </div>
</body>
</html>
